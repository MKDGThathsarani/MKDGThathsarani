<svg width="100%" height="100%" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1b2a;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:1" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="15"/>

  <!-- Animated Network Lines & Dots -->
  <g stroke="#00f2fe" stroke-width="0.5" opacity="0.3">
    <line x1="100" y1="50" x2="300" y2="150">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="300" y1="150" x2="500" y2="80">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="500" y1="80" x2="800" y2="200">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="800" y1="200" x2="1100" y2="100">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4.5s" repeatCount="indefinite" />
    </line>
    <line x1="200" y1="350" x2="400" y2="250">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="400" y1="250" x2="700" y2="350">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="700" y1="350" x2="1000" y2="280">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="6s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Animated Dots (Nodes) -->
  <g fill="#00f2fe">
    <circle cx="100" cy="50" r="3">
      <animate attributeName="r" values="2;5;2" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="150" r="3">
      <animate attributeName="r" values="2;5;2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="500" cy="80" r="3">
      <animate attributeName="r" values="2;5;2" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="800" cy="200" r="4">
      <animate attributeName="r" values="2;6;2" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1100" cy="100" r="3">
      <animate attributeName="r" values="2;5;2" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="200" cy="350" r="3">
      <animate attributeName="r" values="2;5;2" dur="4.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="400" cy="250" r="4">
      <animate attributeName="r" values="2;6;2" dur="3.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="350" r="3">
      <animate attributeName="r" values="2;5;2" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="280" r="3">
      <animate attributeName="r" values="2;5;2" dur="4.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Profile Text (Fade In Animation) -->
  <g text-anchor="start" font-family="'Segoe UI', Arial, sans-serif">
    
    <!-- Name -->
    <text x="60" y="130" font-size="55" font-weight="bold" fill="url(#textGrad)" filter="url(#glow)">
      M.K.D.G. Thathsarani
      <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze" />
      <animateTransform attributeName="transform" type="translate" values="-20,0; 0,0" dur="2s" fill="freeze" />
    </text>

    <!-- Title -->
    <text x="60" y="180" font-size="24" fill="#ffffff" opacity="0.9">
      Software Engineering Undergraduate | Fullstack Developer
      <animate attributeName="opacity" values="0;1" dur="2s" begin="0.5s" fill="freeze" />
    </text>

    <!-- Education -->
    <text x="60" y="220" font-size="18" fill="#8b949e">
      🎓 BSc (Hons) Health Information and Communication Technology
      <animate attributeName="opacity" values="0;1" dur="2s" begin="1s" fill="freeze" />
    </text>

    <!-- Contact Info -->
    <text x="60" y="270" font-size="16" fill="#58a6ff">
      📧 mkdgthathsarani@gmail.com
      <animate attributeName="opacity" values="0;1" dur="2s" begin="1.5s" fill="freeze" />
    </text>
    <text x="60" y="300" font-size="16" fill="#58a6ff">
      🔗 linkedin.com/in/m-k-d-githmi-thathsarani-91754a297
      <animate attributeName="opacity" values="0;1" dur="2s" begin="2s" fill="freeze" />
    </text>

  </g>
</svg>